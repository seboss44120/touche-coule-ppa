<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1">
<title>⚓ Touché Coulé — Administration</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg:#080e1a; --bg2:#0d1624; --bg3:#111e30;
  --text:#d4e8ff; --text2:#7aabcc; --text3:#3f6080;
  --gold:#f5c842; --cyan:#00d4ff; --green:#00e878;
  --red:#ff4455; --orange:#ff8844; --purple:#cc88ff;
  --border:#1a2f4a; --border2:#234; --card:#0f1c2e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;font-size:15px}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:32px;max-width:380px;width:100%;text-align:center}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--gold);letter-spacing:4px;margin-bottom:4px}
.login-sub{font-family:'Orbitron',monospace;font-size:.55rem;color:var(--text3);letter-spacing:3px;margin-bottom:24px}

/* HEADER */
header{background:linear-gradient(135deg,#040b14 0%,#0a1628 60%,#061020 100%);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo-sub{font-family:'Orbitron',monospace;font-size:.58rem;color:var(--text3);letter-spacing:3px;text-transform:uppercase}
.logo-title{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;color:var(--gold);letter-spacing:3px;line-height:1}
.header-right{display:flex;align-items:center;gap:10px;font-size:.72rem}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--text3);display:inline-block;margin-right:5px}
.sdot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.sdot.win{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.role-badge{font-family:'Orbitron',monospace;font-size:.55rem;padding:3px 8px;border-radius:20px;letter-spacing:2px}
.role-badge.admin{background:rgba(245,200,66,.15);border:1px solid var(--gold);color:var(--gold)}

/* NAV */
nav{background:var(--bg2);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 8px}
nav button{font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:700;color:var(--text3);background:none;border:none;border-bottom:2px solid transparent;padding:9px 14px;cursor:pointer;white-space:nowrap;text-transform:uppercase;letter-spacing:.5px;transition:all .2s}
nav button.active{color:var(--gold);border-bottom-color:var(--gold)}
nav button:hover:not(.active){color:var(--text2)}

/* MAIN */
main{padding:12px}
.tab-content{display:none}.tab-content.active{display:block}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:12px}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;color:var(--gold);margin-bottom:10px}
.stitle{font-family:'Orbitron',monospace;font-size:.62rem;color:var(--text3);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}

/* DUEL PANEL */
.duel-panel{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden}
.duel-header{background:linear-gradient(90deg,#0a1828,#081420);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.duel-name{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:3px;color:var(--gold)}
.duel-turn{font-family:'Orbitron',monospace;font-size:.68rem;color:var(--cyan);letter-spacing:2px}
.duel-body{padding:12px}

/* TEAM ROW */
.team-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;background:var(--bg3);border-radius:6px;margin-bottom:6px;gap:8px}
.team-row-info{flex:1;min-width:0}
.team-row-name{font-weight:700;color:var(--text);font-size:.95rem}
.team-row-captain{font-size:.72rem;color:var(--text3)}
.shot-status{font-family:'Orbitron',monospace;font-size:.58rem;padding:3px 7px;border-radius:10px;white-space:nowrap}
.shot-status.done{background:rgba(0,232,120,.12);border:1px solid var(--green);color:var(--green)}
.shot-status.pending{background:rgba(255,68,85,.08);border:1px solid var(--text3);color:var(--text3)}

/* BUTTONS */
.btn{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.85rem;padding:7px 14px;border-radius:6px;border:none;cursor:pointer;letter-spacing:.5px;text-transform:uppercase;transition:all .2s;display:inline-flex;align-items:center;gap:5px}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{background:#e0b430}
.btn-gold:disabled,.btn-gold.disabled{background:#333;color:#555;cursor:default}
.btn-cyan{background:rgba(0,212,255,.15);border:1px solid var(--cyan);color:var(--cyan)}
.btn-cyan:hover{background:rgba(0,212,255,.25)}
.btn-danger{background:rgba(255,68,85,.15);border:1px solid var(--red);color:var(--red)}
.btn-danger:hover{background:rgba(255,68,85,.25)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2)}
.btn-outline:hover{border-color:var(--text3);color:var(--text)}
.btn-sm{font-size:.75rem;padding:4px 9px}
.btn-xs{font-size:.68rem;padding:3px 7px}

/* FORMS */
.form-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-label{font-family:'Orbitron',monospace;font-size:.55rem;color:var(--text3);letter-spacing:1px;text-transform:uppercase}
input,select{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'Rajdhani',sans-serif;font-size:.9rem;font-weight:600;padding:6px 10px;border-radius:5px;outline:none}
input:focus,select:focus{border-color:var(--cyan)}
input::placeholder{color:var(--text3);opacity:.5}
select option{background:var(--bg2)}

/* ALERT */
.alert{padding:8px 12px;border-radius:6px;font-size:.85rem;margin-top:8px;display:none}
.alert.show{display:block}
.alert.ok{background:rgba(0,232,120,.1);border:1px solid var(--green);color:var(--green)}
.alert.err{background:rgba(255,68,85,.1);border:1px solid var(--red);color:var(--red)}
.alert.info{background:rgba(0,212,255,.08);border:1px solid var(--cyan);color:var(--cyan)}

/* GRID */
.grid-wrap{overflow-x:auto}
.game-grid{display:grid;grid-template-columns:22px repeat(10,28px);grid-template-rows:22px repeat(10,28px);gap:2px;margin:8px 0}
.gc-header{display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:.55rem;color:var(--text3)}
.gc{width:28px;height:28px;border-radius:3px;background:rgba(0,50,100,.3);border:1px solid rgba(26,47,74,.8);display:flex;align-items:center;justify-content:center;font-size:.7rem;position:relative}
.gc.placed-PA{background:rgba(255,221,0,.22);border-color:#ffdd00}
.gc.placed-CU{background:rgba(0,212,255,.2);border-color:#00d4ff}
.gc.placed-CR{background:rgba(0,255,140,.18);border-color:#00ff8c}
.gc.placed-SM{background:rgba(100,255,100,.15);border-color:#64ff64}
.gc.placed-TP{background:rgba(255,68,204,.2);border-color:#ff44cc}
.gc.hit{background:rgba(255,100,30,.3);border-color:var(--orange)}
.gc.miss{background:rgba(0,100,200,.15);border-color:rgba(0,100,200,.3)}
.gc.sunk{background:rgba(255,68,85,.35);border-color:var(--red)}

/* TEAMS GRID */
.teams-grid-cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-bottom:12px}
.team-card-cfg{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px}
.team-card-cfg.inactive{opacity:.5}
.team-card-cfg h4{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}

/* URL BOX */
.url-box{font-family:'Orbitron',monospace;font-size:.55rem;word-break:break-all;background:var(--bg);border:1px solid var(--border2);border-radius:5px;padding:6px 8px;color:var(--text3);margin-top:4px;cursor:pointer;transition:border-color .2s}
.url-box:hover{border-color:var(--cyan);color:var(--text2)}

/* TOGGLE */
.toggle{width:34px;height:18px;border-radius:9px;background:var(--border);cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
.toggle::after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .2s}
.toggle.on{background:var(--green)}
.toggle.on::after{left:18px}

/* FLEET */
.fleets-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fleet-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px}
.fleet-name{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--text);margin-bottom:8px}
.ship-bar{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:.8rem}
.ship-bar-cells{display:flex;gap:2px}
.ship-cell{width:14px;height:14px;border-radius:2px;border:1px solid rgba(255,255,255,.15)}
.ship-cell.ok{background:rgba(0,232,120,.4);border-color:var(--green)}
.ship-cell.hit{background:rgba(255,100,30,.5);border-color:var(--orange)}
.ship-cell.sunk-c{background:rgba(255,68,85,.5);border-color:var(--red)}

/* CLASSEMENT */
.rank-table{width:100%;border-collapse:collapse;font-size:.85rem}
.rank-table th{font-family:'Orbitron',monospace;font-size:.55rem;color:var(--text3);letter-spacing:1px;padding:6px 8px;border-bottom:1px solid var(--border);text-align:center}
.rank-table td{padding:7px 8px;border-bottom:1px solid var(--border2);text-align:center}
.pts{font-family:'Orbitron',monospace;font-weight:900;font-size:1rem;color:var(--gold)}
.turn-chip{font-family:'Orbitron',monospace;font-size:.58rem;padding:2px 6px;border-radius:8px;background:rgba(122,171,204,.1);border:1px solid var(--border);color:var(--text3)}
.status-badge{font-family:'Orbitron',monospace;font-size:.55rem;padding:3px 8px;border-radius:12px;letter-spacing:1px;font-weight:700}
.status-badge.ready{background:rgba(122,171,204,.12);border:1px solid var(--text3);color:var(--text3)}
.status-badge.battle{background:rgba(0,212,255,.12);border:1px solid var(--cyan);color:var(--cyan)}
.status-badge.finished{background:rgba(245,200,66,.12);border:1px solid var(--gold);color:var(--gold)}
.duel-status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.duel-status-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center}
.duel-turn-num{font-family:'Orbitron',monospace;font-size:2rem;font-weight:900;color:var(--cyan);line-height:1}
.duel-label{font-family:'Bebas Neue',sans-serif;font-size:.9rem;letter-spacing:2px;color:var(--gold);margin:4px 0}

/* HISTORY */
.hlog{max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.hlog-entry{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:.82rem}
.hlog-turn{font-family:'Orbitron',monospace;font-size:.58rem;color:var(--text3);margin-bottom:4px}

/* SHOT ENTRY */
.shot-entry{background:var(--bg3);border:1px solid var(--border);border-radius:7px;padding:12px;margin-top:8px}
.shot-inputs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.shot-coord{display:flex;gap:4px;align-items:center}

/* SETUP */
.setup-screen{max-width:480px;margin:0 auto;padding:16px 0}

/* URGENCE DROPDOWN */
.urgence-select{background:var(--bg3);border:1px solid var(--border);color:var(--text);
  font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:600;padding:6px 10px;
  border-radius:5px;outline:none;flex:1;min-width:0}
.urgence-select:focus{border-color:var(--orange)}
.mode-badge-admin{font-family:'Orbitron',monospace;font-size:.5rem;padding:2px 7px;
  border-radius:8px;letter-spacing:1px;font-weight:700;display:inline-block}

/* ── TOURNAMENT STATUS VISUALIZATION ── */
.ts-tabs{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:12px;width:fit-content}
.ts-tab{padding:6px 15px;font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;background:transparent;color:var(--text3);border:none;border-right:1px solid var(--border);transition:all .15s}
.ts-tab:last-child{border-right:none}
.ts-tab.active{background:rgba(0,212,255,.1);color:var(--cyan)}
.ts-view{display:none}.ts-view.active{display:block}
.poules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px;margin-bottom:4px}
.poule-card{background:var(--bg3);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.poule-head{padding:9px 13px;background:rgba(0,212,255,.07);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.poule-name{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--cyan)}
.poule-nb{font-family:'Orbitron',monospace;font-size:.5rem;color:var(--text3);letter-spacing:1px}
.ts-sec{font-family:'Orbitron',monospace;font-size:.5rem;color:var(--text3);letter-spacing:1.5px;padding:7px 12px 4px;border-bottom:1px solid var(--border2)}
.ts-mrow{display:flex;align-items:center;gap:5px;padding:6px 12px;border-bottom:1px solid var(--border2)}
.ts-mrow:last-child{border-bottom:none}
.ts-mp{flex:1;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.ts-mp.left{text-align:left}.ts-mp.right{text-align:right}
.ts-mp.win{color:var(--text);font-weight:700}.ts-mp.lose{color:var(--text3)}
.ts-sc{font-family:'Orbitron',monospace;font-size:.65rem;min-width:54px;text-align:center;padding:3px 7px;border-radius:4px;background:var(--bg2);border:1px solid var(--border2);color:var(--text3)}
.ts-sc.done{background:rgba(0,212,255,.07);border-color:rgba(0,212,255,.3);color:var(--cyan)}
.ts-sc.live{background:rgba(255,136,68,.1);border-color:var(--orange);color:var(--orange)}
.ts-tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.ts-tbl th{font-family:'Orbitron',monospace;font-size:.5rem;color:var(--text3);letter-spacing:1px;text-align:center;padding:5px 8px;border-bottom:1px solid var(--border)}
.ts-tbl th:first-child{text-align:left}
.ts-tbl td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--border2)}
.ts-tbl td:first-child{text-align:left}
.ts-tbl tr:last-child td{border-bottom:none}
.ts-rk{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:.52rem;font-weight:700;margin-right:6px;vertical-align:middle;flex-shrink:0}
.ts-rk.r1{background:rgba(245,200,66,.2);border:1px solid var(--gold);color:var(--gold)}
.ts-rk.r2{background:rgba(0,212,255,.12);border:1px solid var(--cyan);color:var(--cyan)}
.ts-rk.rn{background:var(--bg2);border:1px solid var(--border);color:var(--text3)}
/* BRACKET */
.bk-wrap{display:flex;align-items:stretch;overflow-x:auto;padding:4px 0 8px}
.bk-round{display:flex;flex-direction:column;min-width:148px}
.bk-rhead{font-family:'Orbitron',monospace;font-size:.5rem;color:var(--text3);letter-spacing:2px;text-align:center;padding:7px 10px;border-bottom:1px solid var(--border)}
.bk-rmatches{display:flex;flex-direction:column;justify-content:space-around;flex:1;padding:8px 0}
.bk-match{background:var(--bg2);border:1px solid var(--border);border-radius:7px;margin:5px 8px;overflow:hidden}
.bk-row{display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border2)}
.bk-row:last-child{border-bottom:none}
.bk-row.win{background:rgba(0,232,120,.07)}
.bk-row.tbd{opacity:.38}
.bk-nm{flex:1;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.bk-row.win .bk-nm{color:var(--green);font-weight:700}
.bk-sc{font-family:'Orbitron',monospace;font-size:.65rem;font-weight:700;min-width:20px;text-align:right;color:var(--text3)}
.bk-row.win .bk-sc{color:var(--green)}
.bk-conn{width:24px;flex-shrink:0;display:flex;flex-direction:column}
.bk-cl{flex:1;border-right:1px solid var(--border)}
.bk-champ{background:linear-gradient(135deg,rgba(245,200,66,.12),rgba(245,200,66,.03));border:1px solid rgba(245,200,66,.4);border-radius:8px;padding:14px;text-align:center;margin:6px 8px}
.bk-champ-lbl{font-family:'Orbitron',monospace;font-size:.5rem;color:var(--gold);letter-spacing:2px;margin-bottom:6px}
.bk-champ-nm{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:3px;color:var(--gold)}
@media(max-width:500px){main{padding:8px}}
.spin{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ══════════════════════ LOGIN ══════════════════════ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">TOUCHÉ COULÉ</div>
    <div class="login-sub">⚓ Interface Administration</div>

    <div class="form-group" style="text-align:left;margin-bottom:10px">
      <div class="form-label">Email administrateur</div>
      <input id="emailInp" type="email" placeholder="admin@exemple.com" style="width:100%"
        onkeydown="if(event.key==='Enter')document.getElementById('pwdInp').focus()">

</div>

<!-- ══════════════════════ APP ══════════════════════ -->
<div id="app" style="display:none">

  </header>
  <nav id="mainNav"></nav>
  <main id="mainContent"></main>
</div>

// Retourne uniquement les duels actifs selon le nb_groupes de la partie
function getDuelDefs() {
  const nb = PARTIE?.nb_groupes || 3;
  return ALL_DUEL_DEFS.slice(0, nb);
}

// Helper centralisé : statut lisible d'un duel
function duelStatusInfo(duelId) {
  if (!PARTIE?.started) {
    const def = ALL_DUEL_DEFS.find(d => d.id === duelId);
    const total = (def?.nums || []).filter(n => getEquipeByNum(n)?.active).length;
    const ready = (def?.nums || []).filter(n => {
      const e = getEquipeByNum(n);
      return e?.active && getGrilleByEquipeId(e.id)?.is_ready;
    }).length;
    if (ready === total && total > 0) return { label:'✅ Grilles validées', color:'var(--green)', badge:'ready' };
    return { label:`⏳ ${ready}/${total} grille${total>1?'s':''} validée${ready>1?'s':''}`, color:'var(--text3)', badge:'ready' };
  }
  const ds = getDuelState(duelId);
  if (ds.status === 'finished') return { label:'🏁 Terminé', color:'var(--gold)', badge:'finished' };
  if (ds.status === 'battle')   return { label:`⚔️ Tour ${ds.turn} en cours`, color:'var(--cyan)', badge:'battle' };
  return { label:'🟢 Partie démarrée', color:'var(--green)', badge:'battle' };
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function getEquipeByNum(num) {
  return ALL_EQUIPES.find(e => e.numero === num);
}
function getGrilleByEquipeId(id) {
  return ALL_GRILLES.find(g => g.equipe_id === id);
}
function getDuelState(letter) {
  return PARTIE?.duels?.[letter] || { turn:1, status:'ready', winner:null };
}
function duelBothSubmitted(duelId) {
  const def = ALL_DUEL_DEFS.find(d => d.id === duelId);
  if (!def) return false;
  return def.nums.every(n => {
    const e = getEquipeByNum(n);
    if (!e?.active) return false;
    const g = getGrilleByEquipeId(e.id);
    return g?.shots_pending != null;
  });
}

function captainUrl(token) {
  // Génère l'URL capitaine basée sur l'URL actuelle
  const base = location.href.replace(/[^/]*$/, 'capitaine.html');
  return base + '?token=' + token;
}

async function doLogin() {
  const email = (document.getElementById('emailInp')?.value || '').trim();
  const pwd   = document.getElementById('pwdInp')?.value || '';
  const alert = document.getElementById('loginAlert');

  if (!email || !pwd) {
    alert.className = 'alert err show';
    alert.textContent = 'Email et mot de passe requis.';
    return;
  }
  alert.className = 'alert info show';
  alert.textContent = 'Connexion…';

  const { error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) {
    alert.className = 'alert err show';
    alert.textContent = 'Erreur : ' + error.message;
    return;
  }
  await init();
}

async function doLogout() {
  if (!confirm('Se déconnecter ?')) return;
  await sb.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

async function loadAllData() {
  // Charger la partie la plus récente
  const { data: parties } = await sb.from('parties').select('*').order('created_at', { ascending:false }).limit(1);
  PARTIE = parties?.[0] || null;

  if (PARTIE) {
    const [{ data: equipes }, { data: grilles }] = await Promise.all([
      sb.from('equipes').select('*').eq('partie_id', PARTIE.id).order('numero'),
      sb.from('grilles').select('*').eq('partie_id', PARTIE.id),
    ]);
    ALL_EQUIPES = equipes || [];
    ALL_GRILLES = grilles || [];
  } else {
    ALL_EQUIPES = [];
    ALL_GRILLES = [];
  }

  // Charger le tournoi actif (schéma public)
  const { data: tournois } = await sbT.from('tournois')
    .select('*').neq('statut','terminé')
    .order('created_at',{ascending:false}).limit(1);
  TOURNOI = tournois?.[0] || null;
  if (TOURNOI) {
    const { data: jData } = await sbT.from('tournoi_joueurs')
      .select('*').eq('tournoi_id', TOURNOI.id).order('created_at');
    TOURNOI_JOUEURS = jData || [];
    // Si tournoi actif, basculer sur l'onglet tournoi
    if (currentTab === 'config' && TOURNOI) currentTab = 'tournoi';
  }

  // Charger le roster des joueurs permanents
  const { data: rosterData } = await sbT.from('joueur_profils').select('*').order('pseudo');
  ROSTER = rosterData || [];
}

async function doRefresh() {
  await loadAllData();
  renderTab(currentTab);
}

/* Polling grilles toutes les 10s
   Les mises à jour via RPC SECURITY DEFINER (côté capitaine)
   ne déclenchent pas le Realtime admin — on poll en complément */
let _pollTimer = null;
function startGrillesPolling() {
  if (_pollTimer) clearInterval(_pollTimer);
  _pollTimer = setInterval(async () => {
    if (!PARTIE) return;
    const { data: grilles } = await sb.from('grilles').select('*').eq('partie_id', PARTIE.id);
    if (!grilles) return;
    let changed = false;
    grilles.forEach(g => {
      const idx = ALL_GRILLES.findIndex(ag => ag.id === g.id);
      if (idx >= 0) {
        // Comparer le grille entier pour détecter tout changement
        if (JSON.stringify(ALL_GRILLES[idx]) !== JSON.stringify(g)) {
          ALL_GRILLES[idx] = g;
          changed = true;
        }
      } else {
        ALL_GRILLES.push(g);
        changed = true;
      }
    });
    if (changed) renderTab(currentTab);
  }, 8000); // 8 secondes pour réactivité
}

/* ════════════════════════════════════════════════════════
   REALTIME
════════════════════════════════════════════════════════ */
function setupRealtime() {
  // Grilles — l'admin voit tout (authenticated)
  sb.channel('admin-grilles')
    .on('postgres_changes', { event:'*', schema:'touche_coule', table:'grilles' },
      ({ new:n, eventType }) => {
        if (eventType !== 'DELETE') {
          const idx = ALL_GRILLES.findIndex(g => g.id === n.id);
          if (idx >= 0) ALL_GRILLES[idx] = n; else ALL_GRILLES.push(n);
        }
        renderTab(currentTab);
      })
    .subscribe();

  sb.channel('admin-equipes')
    .on('postgres_changes', { event:'UPDATE', schema:'touche_coule', table:'equipes' },
      ({ new:n }) => {
        const idx = ALL_EQUIPES.findIndex(e => e.id === n.id);
        if (idx >= 0) ALL_EQUIPES[idx] = n;
        renderTab(currentTab);
      })
    .subscribe();

  sb.channel('admin-parties')
    .on('postgres_changes', { event:'UPDATE', schema:'touche_coule', table:'parties' },
      ({ new:n }) => { PARTIE = n; updateHeaderStatus(); renderTab(currentTab); })
    .subscribe();

  // Tournoi — écouter inscriptions joueurs
  if (TOURNOI) {
    sbT.channel('admin-tournoi-joueurs')
      .on('postgres_changes', {
        event:'*', schema:'public', table:'tournoi_joueurs',
        filter:`tournoi_id=eq.${TOURNOI.id}`
      }, async () => {
        const { data } = await sbT.from('tournoi_joueurs')
          .select('*').eq('tournoi_id', TOURNOI.id).order('created_at');
        TOURNOI_JOUEURS = data || [];
        if (currentTab === 'tournoi') renderTournoi();
      })
      .subscribe();

    sbT.channel('admin-tournoi-statut')
      .on('postgres_changes', {
        event:'UPDATE', schema:'public', table:'tournois',
        filter:`id=eq.${TOURNOI.id}`
      }, ({ new:n }) => {
        TOURNOI = n;
        if (currentTab === 'tournoi') renderTournoi();
      })
      .subscribe();

    // Matchs — mise à jour temps réel (statut, score, votes revanche, création revanche)
    sbT.channel('admin-tournoi-matchs')
      .on('postgres_changes', {
        event:'*', schema:'public', table:'tournoi_matchs',
        filter:`tournoi_id=eq.${TOURNOI.id}`
      }, async () => {
        updateHeaderStatus();
        if (currentTab === 'tournoi') {
          await renderStatutTournoi(TOURNOI.id);
          adminChargerMatchsUrgence();
        }
      })
      .subscribe();
  }
}

function buildNav() {
  const tabs = getTabs();
  document.getElementById('mainNav').innerHTML = tabs.map(t =>
    `<button data-tab="${t.id}" onclick="goTab('${t.id}')"
      ${currentTab===t.id?'class="active"':''}>${t.label}</button>`
  ).join('');
  document.getElementById('mainContent').innerHTML = tabs.map(t =>
    `<div class="tab-content ${t.id===currentTab?'active':''}" id="tab-${t.id}"></div>`
  ).join('');
  updateHeaderStatus();
}

function goTab(t) {
  currentTab = t;
  document.querySelectorAll('#mainNav button').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === t));
  document.querySelectorAll('.tab-content').forEach(e =>
    e.classList.toggle('active', e.id === `tab-${t}`));
  renderTab(t);
}

function renderTab(t) {
  updateHeaderStatus();
  if (t === 'config')     renderConfig();
  if (t === 'tour')       renderTour();
  if (t === 'classement') renderClassement();
  if (t === 'flottes')    renderFlottes();
  if (t === 'historique') renderHistorique();
  if (t === 'tournoi')    renderTournoi();
  if (t === 'roster')     renderRoster();
}

function updateHeaderStatus() {
  const el = document.getElementById('hdrStatus');
  if (!el) return;

  // Mode tournoi actif
  if (TOURNOI && TOURNOI.statut !== 'terminé') {
    const statutLabel = {
      inscription: 'Inscriptions',
      poules: 'Phase de poules',
      finales: 'Phases finales',
    }[TOURNOI.statut] || TOURNOI.statut;

    // Calculer les matchs restants depuis TOURNOI_JOUEURS (approx)
    const matchsRestants = (async () => {
      // On utilise le cache si dispo, sinon on affiche juste le statut
    })();

    el.innerHTML = `<span class="sdot on"></span>Tournoi en cours — ${statutLabel}`;

    // Charger le nb de matchs restants en async
    sbT.from('tournoi_matchs')
      .select('statut')
      .eq('tournoi_id', TOURNOI.id)
      .neq('statut', 'terminé')
      .then(({ data }) => {
        const restants = data?.length || 0;
        el.innerHTML = `<span class="sdot on"></span>Tournoi · ${statutLabel} · <strong>${restants} match${restants>1?'s':''} en cours</strong>`;
      });
    return;
  }

  // Mode duel classique
  if (!PARTIE) { el.innerHTML = `<span class="sdot"></span>Aucune partie`; return; }
  const on = PARTIE.started;
  const defs = getDuelDefs();
  const finished = defs.filter(d => getDuelState(d.id).status==='finished').length;
  if (finished === defs.length && PARTIE.started) {
    el.innerHTML = `<span class="sdot win"></span>Partie terminée`;
  } else {
    el.innerHTML = `<span class="sdot ${on?'on':''}"></span>${on ? 'Partie en cours' : 'Configuration'}`;
  }
}

async function creerPartie() {
  const mode = document.querySelector('input[name="modeJeu"]:checked')?.value || 'duel_equipes';

  if (mode === 'tournoi') {
    await creerTournoi();
    return;
  }

  const nom = (document.getElementById('partieNomInp')?.value||'').trim() || 'Partie PPA';
  const nbGroupes = parseInt(document.getElementById('nbGroupesInp')?.value || '3');
  const alert = document.getElementById('createAlert');
  alert.className = 'alert info show'; alert.textContent = 'Création…';

  try {
    // Duels initiaux selon nb_groupes
    const duels = {};
    ALL_DUEL_DEFS.slice(0, nbGroupes).forEach(d => {
      duels[d.id] = { turn:1, status:'ready', winner:null };
    });

    // 1. Créer la partie
    const { data: partie, error: pErr } = await sb.from('parties')
      .insert({ nom, started: false, nb_groupes: nbGroupes, mode: 'duel_equipes', duels })
      .select().single();
    if (pErr) throw pErr;

    // 2. Créer uniquement les équipes des groupes actifs
    const activeGroups = ALL_DUEL_DEFS.slice(0, nbGroupes);
    const equipes = activeGroups.flatMap(def =>
      def.nums.map(num => ({ partie_id: partie.id, numero: num, nom: `Équipe ${num}`, duel_id: def.id }))
    );
    const { data: eqs, error: eErr } = await sb.from('equipes').insert(equipes).select();
    if (eErr) throw eErr;

    // 3. Créer les grilles vides pour chaque équipe
    const grilles = eqs.map(e => ({ equipe_id: e.id, partie_id: partie.id }));
    const { error: gErr } = await sb.from('grilles').insert(grilles);
    if (gErr) throw gErr;

    await loadAllData();
    renderTab('config');
  } catch(err) {
    alert.className = 'alert err show';
    alert.textContent = 'Erreur : ' + err.message;
  }
}

async function creerTournoi() {
  const alert = document.getElementById('createAlert');
  const n = parseInt(document.getElementById('nbJoueursInp')?.value || '4');
  if (n < 2 || n > 8) {
    alert.className='alert err show'; alert.textContent='Nombre de joueurs invalide (2 à 8).'; return;
  }
  alert.className = 'alert info show'; alert.textContent = 'Création du tournoi…';
  try {
    const { data: t, error: errT } = await sbT.from('tournois')
      .insert({ nb_joueurs_cible: n, statut: 'inscription' })
      .select().single();
    if (errT) throw errT;
    TOURNOI = t;
    TOURNOI_JOUEURS = [];
    currentTab = 'tournoi';
    buildNav();
    renderTab('tournoi');
    alert.style.display = 'none';
  } catch(err) {
    alert.className = 'alert err show'; alert.textContent = 'Erreur : ' + err.message;
  }
}

/* ── Tour helpers ── */
async function adminCancelShots(equipeId) {
  await sb.from('grilles').update({ shots_pending: null }).eq('equipe_id', equipeId);
  const g = getGrilleByEquipeId(equipeId);
  if (g) g.shots_pending = null;
  renderTab('tour');
}

async function adminSubmitShots(duelId) {
  const def = ALL_DUEL_DEFS.find(d => d.id === duelId);
  const selNum = _tourSel[duelId] || def.nums[0];
  const e = getEquipeByNum(selNum);
  if (!e) return;

  const g = getGrilleByEquipeId(e.id);
  const alreadyFired = new Set((g?.shot_history||[]).map(s=>s.coord));
  const coords = [], seen = new Set();
  let err = '';

  for (let i = 0; i < 3; i++) {
    const c = document.getElementById(`selC_${duelId}_${i}`)?.value || '';
    const r = document.getElementById(`selR_${duelId}_${i}`)?.value || '';
    const coord = c + r;
    if (seen.has(coord)) { err = `Doublon : ${coord}`; break; }
    if (alreadyFired.has(coord)) { err = `${coord} déjà tiré`; break; }
    seen.add(coord); coords.push(coord);
  }

  const alertEl = document.getElementById(`shotAlert_${duelId}`);
  if (err) {
    if (alertEl) { alertEl.className='alert err show'; alertEl.textContent=err; }
    return;
  }

  await sb.from('grilles').update({ shots_pending: coords }).eq('equipe_id', e.id);
  if (g) g.shots_pending = coords;

  if (alertEl) {
    alertEl.className='alert ok show';
    alertEl.textContent=`✓ Tirs de ${e.nom} enregistrés : ${coords.join(', ')}`;
  }
  setTimeout(() => renderTab('tour'), 600);
}

async function adminValidateDuel(duelId) {
  if (!duelBothSubmitted(duelId)) return;
  if (!confirm(`Valider le tour du Duel ${duelId} ?`)) return;

  const def = ALL_DUEL_DEFS.find(d => d.id === duelId);
  const [n1, n2] = def.nums;
  const e1 = getEquipeByNum(n1);
  const e2 = getEquipeByNum(n2);
  const g1 = getGrilleByEquipeId(e1.id);
  const g2 = getGrilleByEquipeId(e2.id);
  const ds = getDuelState(duelId);
  const turn = ds.turn;

  // Traiter les tirs de e1 contre g2
  const res1 = processShots(g1.shots_pending, g2, e1, turn, duelId);
  // Traiter les tirs de e2 contre g1
  const res2 = processShots(g2.shots_pending, g1, e2, turn, duelId);

  // Mettre à jour les scores
  const score1 = e1.score + res1.points;
  const score2 = e2.score + res2.points;

  // Vérifier fin de duel
  const e1Won = allSunk(g2);
  const e2Won = allSunk(g1);
  const newStatus = (e1Won || e2Won) ? 'finished' : 'battle';
  let winner = null;
  if (e1Won && e2Won) winner = score1 >= score2 ? n1 : n2;
  else if (e1Won) winner = n1;
  else if (e2Won) winner = n2;

  // Bonus global premier coulage
  let newDuels = { ...PARTIE.duels };
  newDuels[duelId] = { turn: turn + 1, status: newStatus, winner };

  let globalBonusTeamId = PARTIE.global_bonus_team_id;
  let bonusScore1 = 0, bonusScore2 = 0;
  if (!globalBonusTeamId && (e1Won || e2Won)) {
    const bonusWinner = e1Won && e2Won
      ? (score1 >= score2 ? e1 : e2)
      : e1Won ? e1 : e2;
    globalBonusTeamId = bonusWinner.id;
    if (bonusWinner.id === e1.id) bonusScore1 = 5;
    else bonusScore2 = 5;
  }

  // Écriture en base (plusieurs updates parallèles)
  await Promise.all([
    // Grille e1 : shot_history + clear shots_pending
    sb.from('grilles').update({
      shot_history: [...(g1.shot_history||[]), ...res1.history],
      shots_pending: null,
      last_submit_at: new Date().toISOString()
    }).eq('equipe_id', e1.id),

    // Grille e2 : shot_history + clear shots_pending + hit_grid mis à jour
    sb.from('grilles').update({
      shot_history: [...(g2.shot_history||[]), ...res2.history],
      shots_pending: null,
      hit_grid: g2.hit_grid  // déjà mis à jour dans processShots
    }).eq('equipe_id', e2.id),

    // hit_grid de g2 mis à jour par e1's shots (défenseur = e2)
    sb.from('grilles').update({ hit_grid: g2.hit_grid }).eq('equipe_id', e2.id),
    // hit_grid de g1 mis à jour par e2's shots (défenseur = e1)
    sb.from('grilles').update({ hit_grid: g1.hit_grid }).eq('equipe_id', e1.id),

    // Scores
    sb.from('equipes').update({ score: score1 + bonusScore1 }).eq('id', e1.id),
    sb.from('equipes').update({ score: score2 + bonusScore2 }).eq('id', e2.id),

    // Partie : duels + bonus global
    sb.from('parties').update({
      duels: newDuels,
      global_bonus_team_id: globalBonusTeamId
    }).eq('id', PARTIE.id),
  ]);

  // Mettre à jour l'état local
  await loadAllData();
  renderTab('tour');
}

/* ── Logique de résolution ── */
function processShots(coords, defenderGrille, attacker, turn, duelId) {
  const results = { history: [], points: 0 };
  if (!coords) return results;

  const defGridData  = defenderGrille.hit_grid || {};
  const defShipData  = defenderGrille.grid_data || {};
  const defShipCells = defenderGrille.ship_cells || {};
  const defBonus     = defenderGrille.bonus_cells || [];
  const defMalus     = defenderGrille.malus_cells || [];

  coords.forEach(coord => {
    defenderGrille.hit_grid = { ...(defenderGrille.hit_grid||{}), [coord]: true };
    const occupant = defShipData[coord];
    let result = 'water', shipKey = null, pts = 0;

    if (defBonus.includes(coord)) {
      result = 'bonus'; pts = 2;
    } else if (defMalus.includes(coord)) {
      result = 'malus'; pts = -2;
    } else if (occupant && SHIP_KEYS.includes(occupant)) {
      shipKey = occupant;
      const allHit = (defShipCells[occupant]||[]).every(c => defenderGrille.hit_grid[c]);
      if (allHit) { result = 'sunk'; pts = SHIPS[occupant].points; }
      else         { result = 'hit';  pts = 1; }
    }

    results.points += pts;
    results.history.push({ coord, result, shipKey, points: pts, turn, duelId });
  });

  return results;
}

function allSunk(grille) {
  const sc = grille?.ship_cells || {};
  const hg = grille?.hit_grid   || {};
  return SHIP_KEYS.every(k => {
    const cells = sc[k];
    if (!cells || !cells.length) return true;
    return cells.every(c => hg[c]);
  });
}

            <span style="color:var(--text3);font-size:.75rem">Non placé</span></div>`;
          return;
        }
        const allS = cells.every(c => hg[c]);
        h += `<div class="ship-bar">
          <span title="${ship.name}">${ship.icon}</span>
          <div class="ship-bar-cells">`;
        cells.forEach(c => {
          const cls = allS ? 'sunk-c' : hg[c] ? 'hit' : 'ok';
          h += `<div class="ship-cell ${cls}" title="${c}"></div>`;
        });
        h += `</div>${allS?'<span style="color:var(--red);font-size:.72rem">💀</span>':''}</div>`;
      });
      h += `</div>`;
    });
    h += `</div>`;
  });

  el.innerHTML = h || `<div class="card"><p style="color:var(--text3)">Aucune flotte à afficher.</p></div>`;
}

/* ════════════════════════════════════════════════════════
   TAB : HISTORIQUE
════════════════════════════════════════════════════════ */
function renderHistorique() {
  const el = document.getElementById('tab-historique');
  if (!el) return;

  let entries = [];
  ALL_EQUIPES.filter(e=>e.active).forEach(e => {
    const g = getGrilleByEquipeId(e.id);
    (g?.shot_history||[]).forEach(s => {
      entries.push({ ...s, attackerName: e.nom, attackerNum: e.numero });
    });
  });

  if (!entries.length) {
    el.innerHTML = `<div class="card"><p style="color:var(--text3)">Aucun tir enregistré.</p></div>`;
    return;
  }

  // Grouper par duelId + turn
  const groups = {};
  entries.forEach(e => {
    const key = `${e.duelId}-${e.turn}`;
    if (!groups[key]) groups[key] = { duelId:e.duelId, turn:e.turn, shots:[] };
    groups[key].shots.push(e);
  });

  const sortedGroups = Object.values(groups)
    .sort((a,b) => a.duelId.localeCompare(b.duelId) || b.turn - a.turn);

  let h = `<div class="card">
    <div class="card-title">📋 Historique des tirs</div>
    <div class="hlog">`;

  sortedGroups.forEach(g => {
    h += `<div class="hlog-entry">
      <div class="hlog-turn">Duel ${g.duelId} — Tour ${g.turn}</div>`;
    g.shots.forEach(s => {
      const resText = {
        water: '🌊 Eau',
        hit:   `💥 Touché (${SHIPS[s.shipKey]?.name||'?'})`,
        sunk:  `💀 Coulé : ${SHIPS[s.shipKey]?.name||'?'}`,
        bonus: '⭐ Bonus',
        malus: '💣 Malus'
      }[s.result] || s.result;
      const col = { water:'var(--text3)', hit:'var(--orange)', sunk:'var(--red)', bonus:'var(--purple)', malus:'var(--red)' }[s.result];
      h += `<div style="font-size:.8rem;padding:2px 0">
        <span style="color:var(--text2)">${esc(s.attackerName)}</span>
        → <span style="color:${col}">${s.coord} : ${resText}</span>
        ${s.points ? `<span style="color:var(--gold);font-size:.72rem">(${s.points>0?'+':''}${s.points})</span>` : ''}
      </div>`;
    });
    h += `</div>`;
  });

  h += `</div>
    <div style="margin-top:12px">
      <button class="btn btn-danger btn-sm" onclick="showUndoPanel()">↩ Annuler le dernier tour d'un duel</button>
    </div>
  </div>
  <div class="card" id="undoPanel" style="display:none">
    <div class="stitle">Choisir le duel à annuler</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${getDuelDefs().map(d=>`<button class="btn btn-danger btn-sm" onclick="undoDuel('${d.id}')">Duel ${d.id}</button>`).join('')}
    </div>
  </div>`;

  el.innerHTML = h;
}

function showUndoPanel() {
  const p = document.getElementById('undoPanel');
  if (p) p.style.display = p.style.display==='none' ? 'block' : 'none';
}

async function undoDuel(duelId) {
  const ds = getDuelState(duelId);
  if (ds.turn <= 1) { alert('Aucun tour à annuler pour ce duel.'); return; }
  if (!confirm(`Annuler le tour ${ds.turn-1} du Duel ${duelId} ?`)) return;

  const prevTurn = ds.turn - 1;
  const def = ALL_DUEL_DEFS.find(d => d.id === duelId);
  const [n1, n2] = def.nums;
  const e1 = getEquipeByNum(n1); const e2 = getEquipeByNum(n2);
  const g1 = getGrilleByEquipeId(e1.id); const g2 = getGrilleByEquipeId(e2.id);

  // Retrouver les tirs du tour précédent
  const hist1 = g1?.shot_history || [];
  const hist2 = g2?.shot_history || [];
  const rem1 = hist1.filter(s => s.turn===prevTurn && s.duelId===duelId);
  const rem2 = hist2.filter(s => s.turn===prevTurn && s.duelId===duelId);

  // Recalculer scores
  const pts1 = rem1.reduce((s,h)=>s+h.points,0);
  const pts2 = rem2.reduce((s,h)=>s+h.points,0);

  // Restaurer hit_grid
  const hg2 = { ...(g2?.hit_grid||{}) };
  rem1.forEach(s => delete hg2[s.coord]);
  const hg1 = { ...(g1?.hit_grid||{}) };
  rem2.forEach(s => delete hg1[s.coord]);

  // Retirer le bonus global si accordé ce tour
  let newGlobalBonus = PARTIE.global_bonus_team_id;
  let bonusPts1 = 0, bonusPts2 = 0;
  if (newGlobalBonus) {
    const bonusEq = ALL_EQUIPES.find(e=>e.id===newGlobalBonus);
    if (bonusEq && bonusEq.duel_id === duelId) {
      if (bonusEq.id === e1.id) bonusPts1 = 5;
      else bonusPts2 = 5;
      newGlobalBonus = null;
    }
  }

  const newDuels = { ...PARTIE.duels };
  newDuels[duelId] = { turn: prevTurn, status: prevTurn===1?'ready':'battle', winner: null };

  await Promise.all([
    sb.from('grilles').update({
      shot_history: hist1.filter(s=>!(s.turn===prevTurn&&s.duelId===duelId)),
      hit_grid: hg1
    }).eq('equipe_id', e1.id),
    sb.from('grilles').update({
      shot_history: hist2.filter(s=>!(s.turn===prevTurn&&s.duelId===duelId)),
      hit_grid: hg2
    }).eq('equipe_id', e2.id),
    sb.from('equipes').update({ score: e1.score - pts1 - bonusPts1 }).eq('id', e1.id),
    sb.from('equipes').update({ score: e2.score - pts2 - bonusPts2 }).eq('id', e2.id),
    sb.from('parties').update({ duels: newDuels, global_bonus_team_id: newGlobalBonus }).eq('id', PARTIE.id),
  ]);

  await loadAllData();
  renderTab('historique');
}

        </div>

          ${url.length>60?url.slice(0,60)+'…':url}
        </div>
      </div>
      <button class="btn btn-outline btn-xs" onclick="copyUrl('${esc(url)}')">📋</button>
    </div>`;
  });
  h += `</div></div></div>`;

  // ── Poste de Combat ──
  if (statut !== 'inscription') {
    h += `<div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:2px 0;user-select:none"
        onclick="const b=document.getElementById('poste-body');const ic=document.getElementById('poste-ic');const open=b.style.display==='block';b.style.display=open?'none':'block';ic.textContent=open?'▼':'▲'">
        <div class="card-title" style="margin:0">⚓ Poste de Combat</div>
        <span id="poste-ic" style="font-family:'Orbitron',monospace;font-size:.7rem;color:var(--cyan);padding:4px 8px">▼</span>
      </div>
      <div id="poste-body" style="display:none">
        <div style="font-family:'Orbitron',monospace;font-size:.58rem;color:var(--text3);letter-spacing:1px;margin:12px 0 10px">
          Intervenir sur un match en cours
        </div>
        <div id="matchsUrgenceList"></div>
      </div>
    </div>`;
  }

  el.innerHTML = h;

  if (statut !== 'inscription') {
    renderStatutTournoi(TOURNOI.id);
    adminChargerMatchsUrgence();
  }
}

/* ── Tournoi helpers ── */
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function tirerPoules(joueurs) {
  const n=joueurs.length, mel=shuffle(joueurs);
  const configs={2:[[2]],3:[[3]],4:[[4]],5:[[3,2]],6:[[3,3]],7:[[4,3]],8:[[4,4]]};
  const tailles=configs[n]||[[n]];
  const poules=[];let idx=0;
  for(const taille of tailles){
    const groupe=mel.slice(idx,idx+taille).map(j=>({...j,bye:false}));
    if(taille===2&&n===5){groupe[Math.floor(Math.random()*2)].bye=true;}
    poules.push(groupe);idx+=taille;
  }
  return poules;
}

function roundRobin(joueurs){
  const paires=[];
  for(let i=0;i<joueurs.length;i++)for(let j=i+1;j<joueurs.length;j++)paires.push([joueurs[i],joueurs[j]]);
  return paires;
}

async function adminLancerTournoi() {
  const modeJeu  = TOURNOI.mode_jeu || _tournoiModeJeu;
  const inscrits = TOURNOI_JOUEURS.filter(j=>!!j.nom);

  // Garde-fou mode
  if (!modeJeu) {
    const alertEl=document.getElementById('alertTournoi');
    if(alertEl){alertEl.className='alert err show';alertEl.textContent='Sélectionnez un mode de jeu avant de lancer.';}
    return;
  }

  const modeLabel = MODES_ADMIN[modeJeu]?.label || modeJeu;
  if(!confirm(`Lancer le tournoi avec ${inscrits.length} joueur(s) en mode ${modeLabel} ?`))return;
  const alertEl=document.getElementById('alertTournoi');
  if(alertEl){alertEl.className='alert info show';alertEl.textContent='Tirage en cours…';}

  try{
    const poules=tirerPoules(inscrits);
    for(const [pi,groupe] of poules.entries()){
      for(const j of groupe){
        await sbT.from('tournoi_joueurs').update({poule_id:pi+1,bye:j.bye||false}).eq('id',j.id);
      }
      const reels=groupe.filter(j=>!j.bye);
      for(const [j1,j2] of roundRobin(reels)){
        const {data:m}=await sbT.from('tournoi_matchs').insert({
          tournoi_id:TOURNOI.id,phase:'poule',poule_id:pi+1,
          joueur1_id:j1.id,joueur2_id:j2.id,statut:'placement',
          mode_jeu:modeJeu
        }).select().single();
        if(m){
          await sbT.from('tournoi_grilles').insert([
            {match_id:m.id,joueur_id:j1.id},
            {match_id:m.id,joueur_id:j2.id},
          ]);
        }
      }
    }
    await sbT.from('tournois').update({statut:'poules'}).eq('id',TOURNOI.id);
    TOURNOI.statut='poules';
    const{data:jData}=await sbT.from('tournoi_joueurs').select('*').eq('tournoi_id',TOURNOI.id).order('created_at');
    TOURNOI_JOUEURS=jData||[];
    renderTournoi();
  }catch(e){
    if(alertEl){alertEl.className='alert err show';alertEl.textContent='Erreur : '+e.message;}
  }
}

/* Sélection du mode de jeu (phase inscription) */
function selectModeJeuTournoi(mode) {
  _tournoiModeJeu  = mode;
  TOURNOI.mode_jeu = mode; // local — persiste tant que la page est ouverte
  // Tentative de persistance DB (gracieuse si colonne absente)
  sbT.from('tournois').update({ mode_jeu: mode }).eq('id', TOURNOI.id)
    .then(({ error }) => { if (error) console.warn('mode_jeu non persisté:', error.message); });
  renderTournoi();
}

async function adminRegenererMatchs(){
  if(!confirm('Regénérer tous les matchs de poules ?\nLes matchs existants seront d\'abord supprimés.'))return;
  const alertEl=document.getElementById('alertTournoi');
  const showErr=msg=>{if(alertEl){alertEl.className='alert err show';alertEl.textContent=msg;}};
  if(alertEl){alertEl.className='alert info show';alertEl.textContent='Suppression des anciens matchs…';}

  try{
    // Supprimer matchs et grilles existants
    const{data:oldMatchs}=await sbT.from('tournoi_matchs').select('id').eq('tournoi_id',TOURNOI.id);
    if(oldMatchs?.length){
      const ids=oldMatchs.map(m=>m.id);
      await sbT.from('tournoi_tours').delete().in('match_id',ids);
      await sbT.from('tournoi_grilles').delete().in('match_id',ids);
      await sbT.from('tournoi_matchs').delete().in('id',ids);
    }

    // Recharger les joueurs inscrits
    const{data:jData}=await sbT.from('tournoi_joueurs').select('*').eq('tournoi_id',TOURNOI.id).not('nom','is',null);
    const inscrits=jData||[];

    if(alertEl)alertEl.textContent='Tirage des poules…';

    // Regénérer
    const poules=tirerPoules(inscrits);
    for(const[pi,groupe] of poules.entries()){
      for(const j of groupe){
        const{error:e1}=await sbT.from('tournoi_joueurs').update({poule_id:pi+1,bye:j.bye||false}).eq('id',j.id);
        if(e1){showErr('Erreur poule : '+e1.message);return;}
      }
      const reels=groupe.filter(j=>!j.bye);
      for(const[j1,j2] of roundRobin(reels)){
        const{data:m,error:e2}=await sbT.from('tournoi_matchs').insert({
          tournoi_id:TOURNOI.id,phase:'poule',poule_id:pi+1,
          joueur1_id:j1.id,joueur2_id:j2.id,statut:'placement',
          mode_jeu:TOURNOI.mode_jeu||_tournoiModeJeu||null
        }).select().single();
        if(e2){showErr('Erreur match : '+e2.message);return;}
        if(m){
          const{error:e3}=await sbT.from('tournoi_grilles').insert([
            {match_id:m.id,joueur_id:j1.id},
            {match_id:m.id,joueur_id:j2.id},
          ]);
          if(e3){showErr('Erreur grilles : '+e3.message);return;}
        }
      }
    }

    // S'assurer que le statut est bien 'poules'
    await sbT.from('tournois').update({statut:'poules'}).eq('id',TOURNOI.id);
    TOURNOI.statut='poules';
    const{data:newJ}=await sbT.from('tournoi_joueurs').select('*').eq('tournoi_id',TOURNOI.id).order('created_at');
    TOURNOI_JOUEURS=newJ||[];
    if(alertEl)alertEl.style.display='none';
    renderTournoi();
  }catch(e){showErr('Erreur inattendue : '+e.message);}
}

async function adminAnnulerTournoi(){
  if(!confirm('Supprimer ce tournoi définitivement ?'))return;
  const tid=TOURNOI.id;
  // Supprimer dans l'ordre des dépendances FK pour éviter les violations de contraintes
  const{data:matchs}=await sbT.from('tournoi_matchs').select('id').eq('tournoi_id',tid);
  const mids=(matchs||[]).map(m=>m.id);
  if(mids.length){
    await sbT.from('tournoi_tours').delete().in('match_id',mids);
    await sbT.from('tournoi_grilles').delete().in('match_id',mids);
    await sbT.from('tournoi_matchs').delete().eq('tournoi_id',tid);
  }
  await sbT.from('tournoi_joueurs').delete().eq('tournoi_id',tid);
  await sbT.from('tournois').delete().eq('id',tid);
  TOURNOI=null;TOURNOI_JOUEURS=[];
  currentTab='config';buildNav();renderTab('config');
}

/* ── tsSwitch : bascule entre les onglets poules / finales ── */
function tsSwitch(view, btn) {
  const pv = document.getElementById('ts-v-poules');
  const fv = document.getElementById('ts-v-finales');
  if (pv) pv.classList.toggle('active', view === 'poules');
  if (fv) fv.classList.toggle('active', view === 'finales');
  btn.closest('.ts-tabs').querySelectorAll('.ts-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
}

/* ── renderBracketMatch : génère un bloc match pour le bracket ── */
function renderBracketMatch(m, nomById) {
  const done  = m.statut === 'terminé';
  const n1    = m.joueur1_id ? esc(nomById[m.joueur1_id] || '?') : null;
  const n2    = m.joueur2_id ? esc(nomById[m.joueur2_id] || '?') : null;
  const j1win = done && m.vainqueur_id === m.joueur1_id;
  const j2win = done && m.vainqueur_id === m.joueur2_id;
  const s1    = done ? (m.pts_j1 ?? 0) : '';
  const s2    = done ? (m.pts_j2 ?? 0) : '';
  return `<div class="bk-match">
    <div class="bk-row ${j1win ? 'win' : ''} ${!n1 ? 'tbd' : ''}">
      <span class="bk-nm">${n1 || 'En attente…'}</span>
      <span class="bk-sc">${s1}</span>
    </div>
    <div class="bk-row ${j2win ? 'win' : ''} ${!n2 ? 'tbd' : ''}">
      <span class="bk-nm">${n2 || 'En attente…'}</span>
      <span class="bk-sc">${s2}</span>
    </div>
  </div>`;
}

/* ── renderStatutTournoi : cœur de la visualisation ── */
async function renderStatutTournoi(tournoiId) {
  const container = document.getElementById('ts-container');
  if (!container) return;

  const { data: matchs } = await sbT.from('tournoi_matchs')
    .select('id,phase,poule_id,joueur1_id,joueur2_id,statut,vainqueur_id,pts_j1,pts_j2,partie_numero,vote_revanche_j1,vote_revanche_j2')
    .eq('tournoi_id', tournoiId)
    .order('created_at');

  if (!matchs?.length) {
    container.innerHTML = `<div style="font-family:'Orbitron',monospace;font-size:.55rem;color:var(--text3);text-align:center;padding:16px;letter-spacing:2px">Aucun match généré</div>`;
    return;
  }

  const statut      = TOURNOI.statut;
  const nomById     = Object.fromEntries(TOURNOI_JOUEURS.map(j => [j.id, j.nom || '?']));
  const hasPoules   = matchs.some(m => m.phase === 'poule');
  const hasFinales  = matchs.some(m => m.phase === 'demi' || m.phase === 'finale');
  const showTabs    = hasPoules && hasFinales;
  const initView    = (statut === 'finales' || statut === 'terminé') ? 'finales' : 'poules';
  let html = '';

  // ── Onglets si les deux phases existent ──
  if (showTabs) {
    html += `<div class="ts-tabs">
      <button class="ts-tab ${initView==='poules'?'active':''}" onclick="tsSwitch('poules',this)">⚔️ Poules</button>
      <button class="ts-tab ${initView==='finales'?'active':''}" onclick="tsSwitch('finales',this)">🏆 Finales</button>
    </div>`;
  }

  // ══════════════════ VUE POULES ══════════════════
  if (hasPoules) {
    html += `<div id="ts-v-poules" class="ts-view ${(!showTabs || initView==='poules') ? 'active' : ''}">`;
    const pouleMatchs  = matchs.filter(m => m.phase === 'poule');
    const pouleIds     = [...new Set(pouleMatchs.map(m => m.poule_id))].sort((a,b)=>a-b);
    const nbPoules     = pouleIds.length;
    const nbQualif     = nbPoules > 1 ? 2 : 1;   // top 2 qualifiés si plusieurs poules
    const letters      = 'ABCDEFGH';

    html += `<div class="poules-grid">`;
    for (const pid of pouleIds) {
      const pm  = pouleMatchs.filter(m => m.poule_id === pid);
      const ltr = letters[(pid - 1)] || pid;
      const jids = [...new Set(pm.flatMap(m => [m.joueur1_id, m.joueur2_id]))];

      // ── Matchs ──
      html += `<div class="poule-card">
        <div class="poule-head">
          <span class="poule-name">Poule ${ltr}</span>
          <span class="poule-nb">${jids.length} joueurs</span>
        </div>
        <div class="ts-sec">Matchs</div>
        <div>`;
      for (const m of pm) {
        const n1   = esc(nomById[m.joueur1_id] || '?');
        const n2   = esc(nomById[m.joueur2_id] || '?');
        const done = m.statut === 'terminé';
        const live = m.statut === 'en_cours';
        const j1w  = done && m.vainqueur_id === m.joueur1_id;
        const j2w  = done && m.vainqueur_id === m.joueur2_id;
        // Statut série revanche
        const pNum = m.partie_numero||1;
        const v1 = m.vote_revanche_j1, v2 = m.vote_revanche_j2;
        const revancheAsked = done && (v1===true||v2===true) && v1!==false && v2!==false;
        const revancheRefused = done && (v1===false||v2===false);
        let scCls = done ? 'done' : live ? 'live' : '';
        let scTxt = done ? `${m.pts_j1??0}–${m.pts_j2??0}` : live ? 'en cours' : '–';
        if(pNum>1) scTxt += ` <span style="font-family:'Orbitron',monospace;font-size:.42rem;opacity:.7">P${pNum}</span>`;
        // Sous-label statut série
        let serieLabel = '';
        if(done&&pNum===1&&revancheAsked&&!revancheRefused) serieLabel=`<div style="font-family:'Orbitron',monospace;font-size:.4rem;color:var(--gold);letter-spacing:1px;margin-top:1px">Revanche demandée</div>`;
        else if(done&&pNum===2&&revancheAsked&&!revancheRefused) serieLabel=`<div style="font-family:'Orbitron',monospace;font-size:.4rem;color:var(--orange);letter-spacing:1px;margin-top:1px">Belle demandée</div>`;
        else if(done&&pNum>=3) serieLabel=`<div style="font-family:'Orbitron',monospace;font-size:.4rem;color:var(--text3);letter-spacing:1px;margin-top:1px">Terminé définitivement</div>`;
        html += `<div class="ts-mrow">
          <span class="ts-mp left ${j1w?'win':done?'lose':''}">${n1}</span>
          <span class="ts-sc ${scCls}" style="text-align:center">${scTxt}${serieLabel}</span>
          <span class="ts-mp right ${j2w?'win':done?'lose':''}">${n2}</span>
        </div>`;
      }
      html += `</div>`;

      // ── Classement ──
      const standings = jids.map(jid => {
        let wins = 0, pp = 0, pc = 0;
        for (const m of pm) {
          if (m.statut !== 'terminé') continue;
          if (m.joueur1_id !== jid && m.joueur2_id !== jid) continue;
          if (m.vainqueur_id === jid) wins++;
          if (m.joueur1_id === jid) { pp += m.pts_j1 ?? 0; pc += m.pts_j2 ?? 0; }
          else                      { pp += m.pts_j2 ?? 0; pc += m.pts_j1 ?? 0; }
        }
        return { jid, nom: nomById[jid] || '?', wins, diff: pp - pc };
      }).sort((a, b) => b.wins - a.wins || b.diff - a.diff || a.nom.localeCompare(b.nom));

      html += `<div class="ts-sec" style="margin-top:2px">Classement</div>
        <table class="ts-tbl"><thead><tr>
          <th>Joueur</th><th>V</th><th>Diff</th><th>Rang</th>
        </tr></thead><tbody>`;
      standings.forEach((s, i) => {
        const rkCls  = i === 0 ? 'r1' : i < nbQualif ? 'r2' : 'rn';
        const rkNum  = i + 1;
        const qual   = i < nbQualif;
        const diff   = s.diff > 0 ? `+${s.diff}` : `${s.diff}`;
        const difCol = s.diff >= 0 ? 'var(--cyan)' : 'var(--red)';
        const rngTxt = qual
          ? `<span style="font-family:'Orbitron',monospace;font-size:.5rem;color:var(--green)">✓ Qualif.</span>`
          : `<span style="color:var(--text3)">—</span>`;
        html += `<tr>
          <td><span class="ts-rk ${rkCls}">${rkNum}</span>${esc(s.nom)}</td>
          <td>${s.wins}</td>
          <td style="font-family:'Orbitron',monospace;font-size:.65rem;color:${difCol}">${diff}</td>
          <td>${rngTxt}</td>
        </tr>`;
      });
      html += `</tbody></table></div>`;
    }
    html += `</div></div>`;
  }

  // ══════════════════ VUE BRACKET ══════════════════
  if (hasFinales || statut === 'finales' || statut === 'terminé') {
    html += `<div id="ts-v-finales" class="ts-view ${(!showTabs || initView==='finales') ? 'active' : ''}">`;
    const demis    = matchs.filter(m => m.phase === 'demi');
    const finales  = matchs.filter(m => m.phase === 'finale');
    html += `<div class="bk-wrap">`;

    // Demi-finales
    if (demis.length > 0) {
      html += `<div class="bk-round">
        <div class="bk-rhead">Demi-finales</div>
        <div class="bk-rmatches">`;
      demis.forEach(m => { html += renderBracketMatch(m, nomById); });
      html += `</div></div>`;
      // Connecteur
      const nConn = demis.length;
      html += `<div class="bk-conn">`;
      for (let i = 0; i < nConn; i++) html += `<div class="bk-cl"></div>`;
      html += `</div>`;
    }

    // Finale
    html += `<div class="bk-round">
      <div class="bk-rhead">Finale</div>
      <div class="bk-rmatches" style="justify-content:center">`;
    if (finales.length > 0) {
      finales.forEach(m => { html += renderBracketMatch(m, nomById); });
    } else {
      html += `<div class="bk-match">
        <div class="bk-row tbd"><span class="bk-nm">En attente…</span></div>
        <div class="bk-row tbd"><span class="bk-nm">En attente…</span></div>
      </div>`;
    }
    html += `</div></div>`;

    // Connecteur + Champion
    const champId  = finales[0]?.vainqueur_id;
    const champNom = champId ? nomById[champId] : null;
    html += `<div class="bk-conn"><div class="bk-cl" style="flex:none;height:50%;margin-top:auto"></div></div>
      <div class="bk-round">
        <div class="bk-rhead">Champion</div>
        <div class="bk-rmatches" style="justify-content:center">`;
    if (champNom) {
      html += `<div class="bk-champ">
        <div class="bk-champ-lbl">🏆 CAPITAINE CHAMPION</div>
        <div class="bk-champ-nm">${esc(champNom)}</div>
      </div>`;
    } else {
      html += `<div class="bk-match">
        <div class="bk-row tbd"><span class="bk-nm">En attente…</span></div>
      </div>`;
    }
    html += `</div></div>`;

    html += `</div></div>`;
  }

  container.innerHTML = html;
}

  const tourByMatch=Object.fromEntries((tours||[]).map(t=>[t.match_id,t]));

  container.innerHTML=matchs.map(m=>{
    const j1=esc(nomById[m.joueur1_id]||'?'),j2=esc(nomById[m.joueur2_id]||'?');
    const tour=tourByMatch[m.id];
    const tourNum=tour?.numero_tour||'—';
    const phaseLabel={poule:'Poule',demi:'Demi-finale',finale:'Finale'}[m.phase]||m.phase;
    const stCol={placement:'var(--text2)',en_cours:'var(--cyan)',en_attente:'var(--text2)'}[m.statut]||'var(--text2)';

    // Mode de jeu
    const modeObj=m.mode_jeu?MODES_ADMIN[m.mode_jeu]:null;
    const modeOptions=Object.entries(MODES_ADMIN).map(([k,v])=>`<option value="${k}" ${m.mode_jeu===k?'selected':''}>${v.icon} ${v.label}</option>`).join('');
    const modeBadge=modeObj
      ?`<span class="mode-badge-admin" style="background:rgba(0,0,0,.25);border:1px solid ${modeObj.color};color:${modeObj.color}">${modeObj.icon} ${modeObj.label}</span>
         <button class="btn btn-xs btn-outline" style="margin-left:4px" onclick="ouvrirChangerMode('${m.id}')">✏️</button>`
      :`<span style="display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap">
          <select id="mode-sel-${m.id}" class="urgence-select" style="flex:1;min-width:140px;max-width:200px;font-size:.75rem;padding:4px 8px;border-color:var(--orange)">
            <option value="">— Choisir le mode —</option>
            ${modeOptions}
          </select>
          <button class="btn btn-sm btn-gold" onclick="adminDefinirMode('${m.id}')">✓ Appliquer</button>
        </span>`;

    // Statut du tour en classique / petite_victime
    let tourLabel='';
    if(tour&&m.statut==='en_cours'){
      const mode=m.mode_jeu||'rush';
      if(mode==='classique'||mode==='petite_victime'){
        const ph=tour.classique_phase||'j1_turn';
        const quiJoue=ph==='j1_turn'?j1:j2;
        const mLbl=mode==='petite_victime'?'🚤 Petite Victime':'⚓ Classique';
        // En petite_victime : si J1 a soumis mais pas J2, phase=j2_turn mais résolution pas encore faite
        const soumis1=tour.soumis_j1,soumis2=tour.soumis_j2;
        if(mode==='petite_victime'&&soumis1&&!soumis2) tourLabel=`⏳ ${j1} a tiré — en attente de <strong>${j2}</strong> (${mLbl} · Tour ${tour.numero_tour})`;
        else tourLabel=`🎯 <strong>${quiJoue}</strong> doit tirer (${mLbl} · Tour ${tour.numero_tour})`;
      }else{
        if(!tour.soumis_j1&&!tour.soumis_j2) tourLabel=`⏳ En attente de <strong>${j1}</strong> et <strong>${j2}</strong>`;
        else if(tour.soumis_j1&&!tour.soumis_j2) tourLabel=`⏳ En attente de <strong>${j2}</strong> — ${j1} a joué`;
        else if(!tour.soumis_j1&&tour.soumis_j2) tourLabel=`⏳ En attente de <strong>${j1}</strong> — ${j2} a joué`;
        else tourLabel='✓ Les deux ont soumis — résolution en cours';
      }
    } else if(m.statut==='placement') tourLabel='⚓ Placement des flottes';

    // Partie série (revanche/belle)
    const partieLabel=m.partie_numero>1?`<span style="font-family:'Orbitron',monospace;font-size:.48rem;color:var(--gold);margin-left:6px">PARTIE ${m.partie_numero}</span>`:'';

    return `<div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:6px">
        <div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
            <span style="font-weight:700;font-size:.9rem">${j1} <span style="color:var(--text2);font-size:.75rem">vs</span> ${j2}</span>
            ${partieLabel}
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-family:'Orbitron',monospace;font-size:.52rem;color:${stCol};letter-spacing:1px">${phaseLabel} · ${m.statut.toUpperCase()}</span>
            ${modeBadge}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-family:'Orbitron',monospace;font-size:1.1rem;font-weight:900;color:var(--cyan)">${tourNum}</div>
          <div style="font-family:'Orbitron',monospace;font-size:.48rem;color:var(--text2)">TOUR</div>
        </div>
      </div>
      ${tourLabel?`<div style="font-size:.8rem;color:var(--text2);margin-bottom:10px">${tourLabel}</div>`:''}
      <div style="display:flex;gap:8px;align-items:center">
        <select class="urgence-select" id="urgence-sel-${m.id}">
          <option value="">— Choisir une action —</option>
          ${m.statut==='en_cours'?`<option value="annuler_tour">🔄 Annuler le tour en cours (rejouable)</option>`:''}
          <option value="supprimer_match">🗑️ Supprimer ce match</option>
        </select>
        <button class="btn btn-danger btn-sm" onclick="execUrgenceAction('${m.id}')">▶ GO</button>
      </div>
    </div>`;
  }).join('');
}

async function execUrgenceAction(matchId){
  const sel=document.getElementById(`urgence-sel-${matchId}`);
  const action=sel?.value;
  if(!action){alert('Choisissez une action.');return;}
  if(action==='annuler_tour') await adminAnnulerTourMatch(matchId);
  else if(action==='supprimer_match') await adminSupprimerMatch(matchId);
}


async function adminDefinirMode(matchId){
  const sel=document.getElementById(`mode-sel-${matchId}`);
  const mode=sel?.value;
  if(!mode){alert("Choisissez un mode de jeu.");return;}
  const modeObj=MODES_ADMIN[mode];
  if(!confirm(`Définir le mode "${modeObj.icon} ${modeObj.label}" pour ce match ?`))return;
  const{error}=await sbT.from("tournoi_matchs").update({mode_jeu:mode}).eq("id",matchId);
  if(error){alert("Erreur : "+error.message);return;}
  await adminChargerMatchsUrgence();
}

async function ouvrirChangerMode(matchId){
  const cles=Object.entries(MODES_ADMIN).map(([k,v])=>`${v.icon} ${v.label} → ${k}`).join("\n");
  const nouveau=(prompt(`Nouveau mode de jeu :\n${cles}`)||"").trim();
  if(!nouveau||!MODES_ADMIN[nouveau]){if(nouveau)alert("Mode invalide.");return;}
  const modeObj=MODES_ADMIN[nouveau];
  if(!confirm(`Changer le mode en "${modeObj.icon} ${modeObj.label}" ?`))return;
  const{error}=await sbT.from("tournoi_matchs").update({mode_jeu:nouveau}).eq("id",matchId);
  if(error){alert("Erreur : "+error.message);return;}
  await adminChargerMatchsUrgence();
}
async function adminAnnulerTourMatch(matchId){
  if(!confirm('Annuler le tour en cours ? Les joueurs pourront rejouer ce tour.'))return;
  const{data:tours}=await sbT.from('tournoi_tours').select('id,numero_tour')
    .eq('match_id',matchId).eq('statut','en_cours')
    .order('numero_tour',{ascending:false}).limit(1);
  if(tours?.length){
    await sbT.from('tournoi_tours').delete().eq('id',tours[0].id);
    await sbT.from('tournoi_tours').insert({
      match_id:matchId,numero_tour:tours[0].numero_tour,
      soumis_j1:false,soumis_j2:false,statut:'en_cours'
    });
    await adminChargerMatchsUrgence();
  } else { alert('Aucun tour en cours à annuler.'); }
}

async function adminSupprimerMatch(matchId){
  if(!confirm('Supprimer ce match ? Les stats joueurs ne seront pas affectées.'))return;
  await sbT.from('tournoi_tours').delete().eq('match_id',matchId);
  await sbT.from('tournoi_grilles').delete().eq('match_id',matchId);
  await sbT.from('tournoi_matchs').delete().eq('id',matchId);
  await adminChargerMatchsUrgence();
}

async function adminAjouterJoueurDuRoster(profilId) {
  if (TOURNOI_JOUEURS.find(j => j.profil_id === profilId)) return; // déjà inscrit
  const profil = ROSTER.find(p => p.id === profilId);
  if (!profil) return;
  const alertEl = document.getElementById('alertJoueurs');
  try {
    const { data, error } = await sbT.from('tournoi_joueurs')
      .insert({ tournoi_id: TOURNOI.id, nom: profil.pseudo, profil_id: profil.id })
      .select().single();
    if (error) throw error;
    TOURNOI_JOUEURS.push(data);
    renderTournoi();
  } catch(e) {
    if (alertEl) { alertEl.className='alert err show'; alertEl.textContent='Erreur : '+e.message; }
  }
}

async function adminCreerNouveauJoueurTournoi() {
  const pseudo  = (document.getElementById('newTJPseudo')?.value || '').trim();
  const email   = (document.getElementById('newTJEmail')?.value || '').trim();
  const alertEl = document.getElementById('alertJoueurs');

  if (pseudo.length < 2) {
    if (alertEl) { alertEl.className='alert err show'; alertEl.textContent='Pseudo trop court (min. 2 caractères).'; }
    return;
  }
  if (ROSTER.find(p => p.pseudo.toLowerCase() === pseudo.toLowerCase())) {
    if (alertEl) { alertEl.className='alert err show'; alertEl.textContent='Ce pseudo existe déjà dans le Roster.'; }
    return;
  }

  if (alertEl) { alertEl.className='alert info show'; alertEl.textContent='Création du joueur…'; }
  try {
    // 1. Créer le profil permanent
    const insertData = { pseudo, avatar: '⚓', drapeau: 'fr' };
    let np;
    if (email) {
      const { data, error } = await sbT.from('joueur_profils').insert({ ...insertData, email }).select().single();
      if (error && (error.code === '42703' || error.message?.includes('email'))) {
        // Colonne email absente → retry sans
        const { data: d2, error: e2 } = await sbT.from('joueur_profils').insert(insertData).select().single();
        if (e2) throw e2;
        np = d2;
      } else {
        if (error) throw error;
        np = data;
      }
    } else {
      const { data, error } = await sbT.from('joueur_profils').insert(insertData).select().single();
      if (error) throw error;
      np = data;
    }
    ROSTER.push(np);
    ROSTER.sort((a,b) => a.pseudo.localeCompare(b.pseudo));

    // 2. Inscrire au tournoi
    const { data: tj, error: errJ } = await sbT.from('tournoi_joueurs')
      .insert({ tournoi_id: TOURNOI.id, nom: np.pseudo, profil_id: np.id })
      .select().single();
    if (errJ) throw errJ;
    TOURNOI_JOUEURS.push(tj);

    // 3. Afficher le lien permanent
    const permUrl = np.token ? `${BASE_URL_JEU}?p=${np.token}` : null;
    const linkMsg = permUrl
      ? `✓ ${np.pseudo} inscrit ! Lien permanent : ${permUrl}`
      : `✓ ${np.pseudo} inscrit ! (Exécutez la migration SQL dans le Roster pour générer son lien permanent)`;

    if (alertEl) { alertEl.className='alert ok show'; alertEl.textContent=linkMsg; }
    if (document.getElementById('newTJPseudo')) document.getElementById('newTJPseudo').value='';
    if (document.getElementById('newTJEmail')) document.getElementById('newTJEmail').value='';
    renderTournoi();

    // Copier le lien si disponible
    if (permUrl) { try { await navigator.clipboard.writeText(permUrl); } catch(e) {} }
  } catch(e) {
    if (alertEl) { alertEl.className='alert err show'; alertEl.textContent='Erreur : '+e.message; }
  }
}

async function adminSupprimerJoueurDeTournoi(joueurId) {
  if (!confirm('Retirer ce joueur du tournoi ?')) return;
  const { error } = await sbT.from('tournoi_joueurs').delete().eq('id', joueurId);
  if (error) { alert('Erreur : ' + error.message); return; }
  TOURNOI_JOUEURS = TOURNOI_JOUEURS.filter(j => j.id !== joueurId);
  renderTournoi();
}

function _adminGetGrade(v) {
  const G=[{l:'Matelot',m:0},{l:'Matelot 1ère classe',m:5},{l:'Matelot 2nde classe',m:10},{l:'Quartier-maître',m:15},{l:'Second maître',m:20},{l:'Maître',m:25},{l:'Premier maître',m:35},{l:'Maître principal',m:45},{l:'Major',m:55},{l:'Aspirant',m:65},{l:'Enseigne de vaisseau',m:80},{l:'Lieutenant de vaisseau',m:95},{l:'Capitaine de corvette',m:110},{l:'Capitaine de frégate',m:125},{l:'Capitaine de vaisseau',m:140},{l:'Amiral',m:155}];
  let g=G[0];for(const gr of G){if(v>=gr.m)g=gr;else break;}return g.l;
}

      <div class="card-title" style="color:var(--gold);font-size:.85rem">🔧 Migration SQL requise</div>
      <div style="font-family:'Orbitron',monospace;font-size:.52rem;color:var(--text2);letter-spacing:1px;line-height:2;margin-bottom:10px">
        Des joueurs n'ont pas encore de token permanent. Exécutez cette migration dans Supabase SQL Editor :
      </div>
      <div style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-family:'Courier New',monospace;font-size:.72rem;color:var(--cyan);letter-spacing:.5px;word-break:break-all;cursor:pointer"
        onclick="copyUrl(this.textContent.trim())" title="Cliquer pour copier">ALTER TABLE joueur_profils ADD COLUMN IF NOT EXISTS token text UNIQUE DEFAULT gen_random_uuid()::text;</div>
      <div style="font-family:'Orbitron',monospace;font-size:.48rem;color:var(--text3);margin-top:6px;letter-spacing:.5px">Cliquez sur le bloc pour copier · Non-destructif · À exécuter une seule fois</div>
    </div>`;
  }

  el.innerHTML = h;
}

function showAddRosterForm() {
  const f = document.getElementById('addRosterForm');
  if (f) { f.style.display = 'block'; setTimeout(()=>document.getElementById('newRosterPseudo')?.focus(), 100); }
}

async function adminAjouterJoueurRoster() {
  const input  = document.getElementById('newRosterPseudo');
  const emailInp = document.getElementById('newRosterEmail');
  const alertEl = document.getElementById('rosterAddAlert');
  const pseudo = (input?.value || '').trim();
  const email  = (emailInp?.value || '').trim();
  if (pseudo.length < 2) { if(alertEl){alertEl.className='alert err show';alertEl.textContent='Pseudo trop court (min. 2 caractères).';} return; }

  // Vérifier doublon
  if (ROSTER.find(p => p.pseudo.toLowerCase() === pseudo.toLowerCase())) {
    if(alertEl){alertEl.className='alert err show';alertEl.textContent='Ce pseudo est déjà dans le roster.';}
    return;
  }

  if(alertEl){alertEl.className='alert info show';alertEl.textContent='Création…';}
  try {
    const insertData = { pseudo, avatar: '⚓', drapeau: 'fr' };
    let np;
    // Essai avec email (si colonne existe)
    if (email) {
      const { data, error } = await sbT.from('joueur_profils').insert({ ...insertData, email }).select().single();
      if (error && (error.code === '42703' || error.message?.includes('email'))) {
        // Colonne email absente → retry sans
        const { data: d2, error: e2 } = await sbT.from('joueur_profils').insert(insertData).select().single();
        if (e2) throw e2;
        np = d2;
      } else {
        if (error) throw error;
        np = data;
      }
    } else {
      const { data, error } = await sbT.from('joueur_profils').insert(insertData).select().single();
      if (error) throw error;
      np = data;
    }
    ROSTER.push(np);
    ROSTER.sort((a,b) => a.pseudo.localeCompare(b.pseudo));
    if (input) input.value = '';
    if (emailInp) emailInp.value = '';
    document.getElementById('addRosterForm').style.display = 'none';
    if(alertEl) alertEl.style.display = 'none';
    renderRoster();
  } catch(e) {
    if(alertEl){alertEl.className='alert err show';alertEl.textContent='Erreur : '+e.message;}
  }
}

async function adminSupprimerJoueurRoster(profilId, pseudo) {
  if (!confirm(`Supprimer "${pseudo}" du roster ?\n\nSes stats et son historique restent en base, mais son lien permanent sera invalide.`)) return;
  try {
    const { error } = await sbT.from('joueur_profils').delete().eq('id', profilId);
    if (error) throw error;
    ROSTER = ROSTER.filter(p => p.id !== profilId);
    renderRoster();
  } catch(e) {
    alert('Erreur : ' + e.message);
  }
}

async function adminCopierTousLiensPermanents() {
  const lignes = ROSTER
    .filter(p => p.token)
    .map(p => `${p.pseudo} : ${BASE_URL_JEU}?p=${p.token}`);
  if (!lignes.length) { alert('Aucun token disponible — exécutez la migration SQL d\'abord.'); return; }
  const texte = `LIENS PERMANENTS TOUCHÉ COULÉ\n${'─'.repeat(40)}\n${lignes.join('\n')}`;
  await navigator.clipboard.writeText(texte);
  const a = document.createElement('div');
  a.className='alert ok show';
  a.textContent='✓ Tous les liens permanents copiés !';
  a.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;min-width:260px;text-align:center';
  document.body.appendChild(a);
  setTimeout(() => a.remove(), 2500);
}
